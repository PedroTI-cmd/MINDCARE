<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MindCare – Sistema de Agendamento de Consultas">
    <title>{% block title %}MindCare{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block styles %}{% endblock %}

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        :root {
            --mc-primary: #3B82F6;
            --mc-primary-hover: #2563EB;
            --mc-secondary: #6B7280;
            --mc-light: #F9FAFB;
            --mc-text: #1F2937;
            --mc-card-bg: #FFFFFF;
            --mc-border-radius: 0.5rem;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--mc-light);
            color: var(--mc-text);
            padding-top: 1rem;
            padding-bottom: 2rem;
        }
        .card {
            border: none;
            border-radius: var(--mc-border-radius);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .transition-colors { transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1); }
        .btn { border-radius: var(--mc-border-radius); }
        .btn-primary { background-color: var(--mc-primary); border-color: var(--mc-primary); }
        .btn-primary:hover { background-color: var(--mc-primary-hover); border-color: var(--mc-primary-hover); }
        .form-control:focus, .form-select:focus {
            border-color: var(--mc-primary);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        a { color: var(--mc-primary); text-decoration: none; }
        a:hover { color: var(--mc-primary-hover); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show transition-colors mt-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
